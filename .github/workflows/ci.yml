name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # CI uses an ephemeral in-workflow Postgres service (see `services` below).
      # Production builds on Vercel supply their own DATABASE_URL via Vercel env.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/papex
      DATABASE_URL_UNPOOLED: postgres://postgres:postgres@localhost:5432/papex
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: papex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm install

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Migrate database
        run: npm run db:migrate

      - name: Build
        run: npm run build
