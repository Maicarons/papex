name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # CI uses an ephemeral in-workflow Postgres service (see `services` below).
      # Production builds on Vercel supply their own DATABASE_URL via Vercel env.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/papex
      DATABASE_URL_UNPOOLED: postgres://postgres:postgres@localhost:5432/papex
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
    services:
      postgres:
        # pgvector-enabled image so migrations that run `CREATE EXTENSION vector`
        # (e.g. 0009) succeed in CI. Based on postgres:16, same env/ports.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: papex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm install

      - name: Lint
        run: npm run lint

      - name: Generate OpenAPI spec
        # spec.generated.ts is a build artifact (gitignored); generate it before
        # typecheck so the `/api/openapi.json` route import resolves.
        run: npm run openapi:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Migrate database
        run: npm run db:migrate

      - name: Build
        run: npm run build
